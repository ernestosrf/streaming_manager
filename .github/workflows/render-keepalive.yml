# Acorda o serviço web da Render (plano gratuito) sob demanda.
# Ligado 24h, o serviço consome ~744 das 750 horas gratuitas mensais do
# workspace da Render. Outro serviço gratuito no mesmo workspace esgotaria
# a cota, e a Render suspende todos os serviços gratuitos até o mês seguinte.

name: Render keep-alive

on:
  workflow_dispatch: # execução manual pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/health
        env:
          HEALTH_URL: https://streaming-manager.onrender.com/api/health
        # Se o serviço estiver hibernando, acordar leva cerca de 1 minuto.
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors "$HEALTH_URL"
