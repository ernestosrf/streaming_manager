# Testa sob demanda o acesso ao projeto Supabase (plano gratuito)
name: Supabase keep-alive

on:
  workflow_dispatch: # execução manual pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret SUPABASE_DATABASE_URL não configurado"
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA \
            -c "SELECT now() AS pinged_at, (SELECT count(*) FROM content) AS total_content;"
